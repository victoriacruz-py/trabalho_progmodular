services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ecommerce
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ecommerce_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  ecommerce_pg:
