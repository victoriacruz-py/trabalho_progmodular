name: Incremento 1
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ecommerce_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ecommerce -d ecommerce_test" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:boundaries
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://ecommerce:ci_only_password@127.0.0.1:5432/ecommerce_test
      - run: npm run test:web
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
